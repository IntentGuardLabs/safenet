# Sample configuration for the `sentinel` binary.
#
# Copy this file, fill in the deployment-specific values below, and pass it
# with `--config-file=/path/to/your/sentinel.toml` (the binary defaults to
# `sentinel.toml` in its working directory if the flag is omitted). See
# `src/config.rs` for the full schema, and `../../docs/sentinel-handbook.md`
# for an operator's guide to running a sentinel.

# The chain RPC endpoint.
rpc = "https://rpc.gnosischain.com"

# A SQLite connection string for the sentinel's persistent state (request
# tracking, indexer/transaction-queue progress). Must be backed up and
# restored across restarts. `mode=rwc` lets the sentinel create the file on
# first start (it otherwise fails with "unable to open database file"). The
# directory must be writable by the container user (65532).
database = "sqlite:/var/lib/safenet/sentinel/data/storage.db?mode=rwc"

# The `SentinelOracle` contract watched and voted/committed on.
oracle = "0x0000000000000000000000000000000000000000"

# The `Consensus` contract whose proposals are hashed into request ids.
consensus = "0x0000000000000000000000000000000000000000"

# The account used to sign onchain transactions (bond commitments and votes)
# and reveal them onchain, loaded from a Web3 Secret Storage v3 (Geth
# compatible) encrypted JSON keystore. The configuration only references
# secret files; it never contains key material. See the sentinel handbook's
# "Secrets" section for how to create the keystore and provision the password.
# Fund this account with just enough gas and fee token for its onchain work.
[signer]
type = "keystore"
# Relative paths are resolved against the directory of this file.
path = "/run/secrets/sentinel-keystore.json"
# The keystore password, read verbatim: NO trailing newline (`printf '%s'`).
password_file = "/run/secrets/sentinel-keystore-password"
# Mandatory. Startup fails unless the keystore decrypts to exactly this address.
expected_address = "0x0000000000000000000000000000000000000001"

[sentinel]
# The ERC-20 fee token approved for bonds.
fee_token = "0x0000000000000000000000000000000000000000"

# The number of blocks a `Preparing` request is kept alive for before being
# cleaned up.
voting_window = 100

# Base URL of this sentinel's transaction-verification engine. The sentinel
# appends the versioned security-check path itself.
engine = "http://localhost:5473"

[observability]
# The `tracing` env-filter directive controlling log verbosity.
log_filter = "info"

# Optional: address the Prometheus metrics HTTP listener binds to. Defaults
# to an ephemeral port on loopback; set this to expose metrics outside a
# container (see the sentinel handbook's "Logging and Metrics" section).
# metrics_address = "0.0.0.0:3555"

[index]
# Optional: set to work around RPC providers that unreliably return
# `eth_getLogs` results (see the sentinel handbook's "`eth_getLogs`
# Reliability" section).
# use_client_filtering = true

[transactions]
# Optional: caps the priority fee of estimated fees to at most this
# percentage of the total max fee per gas (see the sentinel handbook's gas
# cost tip). Lower values reduce what you can overpay on a bad fee estimate,
# but risk slower inclusion if the cap ends up below what the network needs.
# priority_fee_cap_percentage = 95
